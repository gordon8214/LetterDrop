name: Validate Wrangler Config

on:
  pull_request:
    paths:
      - app/wrangler.example.toml
      - app/scripts/check-wrangler-template.mjs
      - .github/workflows/validate-wrangler.yml
  push:
    branches:
      - main
      - master
    paths:
      - app/wrangler.example.toml
      - app/scripts/check-wrangler-template.mjs
      - .github/workflows/validate-wrangler.yml

jobs:
  validate-wrangler-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate template bindings
        run: node scripts/check-wrangler-template.mjs
