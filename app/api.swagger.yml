swagger: '2.0'
info:
  title: Newsletter API
  description: API for managing newsletters
  version: 1.0.0

paths:
  /api/newsletter:
    get:
      summary: List all newsletters
      description: List all newsletters with subscriber counts
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: limit
          in: query
          type: integer
          default: 50
      responses:
        '200':
          description: Newsletters retrieved successfully
          schema:
            type: object
            properties:
              newsletters:
                type: array
                items:
                  $ref: '#/definitions/Newsletter'
              pagination:
                $ref: '#/definitions/Pagination'
        '500':
          description: Server error
    post:
      summary: Create a new newsletter
      description: Create a new newsletter
      security:
        - AdminBearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateNewsletterRequest'
      responses:
        '201':
          description: Newsletter created successfully
          schema:
            $ref: '#/definitions/Newsletter'
        '500':
          description: Server error

  /api/newsletter/publish-config:
    get:
      summary: Get newsletter publish configuration
      description: Get the email address used to publish newsletters
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Publish configuration retrieved successfully
          schema:
            $ref: '#/definitions/PublishConfig'
        '503':
          description: Publish email address is not configured

  /api/newsletter/{newsletterId}/publish:
    post:
      summary: Publish a newsletter directly
      description: Accept direct newsletter content from an authenticated admin client, create a durable send record, and enqueue delivery to subscribers.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
          format: uuid
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/DirectPublishNewsletterRequest'
      responses:
        '200':
          description: Newsletter publish accepted
          schema:
            $ref: '#/definitions/PublishNewsletterResponse'
        '400':
          description: Invalid newsletter ID or publish payload
        '401':
          description: Missing or invalid admin bearer token
        '404':
          description: Newsletter not found
        '413':
          description: Publish payload is too large
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/sends:
    get:
      summary: List newsletter sends
      description: Return recent durable send records for an authenticated admin.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
          format: uuid
      responses:
        '200':
          description: Newsletter sends retrieved successfully
          schema:
            type: object
            properties:
              sends:
                type: array
                items:
                  $ref: '#/definitions/NewsletterSendSummary'
        '400':
          description: Invalid newsletter ID
        '401':
          description: Missing or invalid admin bearer token
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/sends/{sendId}:
    get:
      summary: Get newsletter send snapshot
      description: Return aggregate send status, recipient rows, and event history for an authenticated admin.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
          format: uuid
        - name: sendId
          in: path
          required: true
          type: string
          format: uuid
      responses:
        '200':
          description: Newsletter send snapshot retrieved successfully
          schema:
            $ref: '#/definitions/NewsletterSendSnapshot'
        '400':
          description: Invalid newsletter ID or send ID
        '401':
          description: Missing or invalid admin bearer token
        '404':
          description: Newsletter send not found
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/sends/{sendId}/stream:
    get:
      summary: Stream newsletter send status
      description: Authenticated WebSocket endpoint for live send status updates. Use afterEventId to replay missed events after reconnect.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
          format: uuid
        - name: sendId
          in: path
          required: true
          type: string
          format: uuid
        - name: afterEventId
          in: query
          type: integer
          default: 0
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          description: Invalid newsletter ID or send ID
        '401':
          description: Missing or invalid admin bearer token
        '404':
          description: Newsletter send not found
        '426':
          description: Expected WebSocket upgrade
        '503':
          description: Send status stream unavailable
        '500':
          description: Server error

  /api/publish/google-workspace:
    post:
      summary: Publish a newsletter from Google Workspace
      description: Accept a parsed Gmail message from the Google Workspace Apps Script bridge, create a durable send record, and enqueue delivery to subscribers.
      security:
        - PublishBridgeBearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GoogleWorkspacePublishRequest'
      responses:
        '200':
          description: Newsletter publish accepted
          schema:
            $ref: '#/definitions/PublishNewsletterResponse'
        '400':
          description: Invalid publish payload
        '401':
          description: Missing or invalid publish bridge bearer token
        '403':
          description: Sender is not in ALLOWED_EMAILS
        '413':
          description: Publish payload is too large
        '503':
          description: Publish bridge token is not configured
        '500':
          description: Server error

  /api/newsletter/{newsletterId}:
    get:
      summary: Get a single newsletter
      description: Get a single newsletter with subscriber count
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Newsletter retrieved successfully
          schema:
            $ref: '#/definitions/Newsletter'
        '404':
          description: Newsletter not found
        '500':
          description: Server error
    put:
      summary: Update a newsletter
      description: Partial update of newsletter fields (title, description, logo)
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateNewsletterRequest'
      responses:
        '200':
          description: Newsletter updated successfully
          schema:
            $ref: '#/definitions/Newsletter'
        '404':
          description: Newsletter not found
        '500':
          description: Server error
    delete:
      summary: Delete a newsletter
      description: Delete a newsletter, its subscribers, and R2 content
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Newsletter deleted successfully
        '404':
          description: Newsletter not found
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/subscribers:
    get:
      summary: List subscribers
      description: List all subscribers for a newsletter (subscribed and unsubscribed)
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
        - name: page
          in: query
          type: integer
          default: 1
        - name: limit
          in: query
          type: integer
          default: 50
      responses:
        '200':
          description: Subscribers retrieved successfully
          schema:
            type: object
            properties:
              subscribers:
                type: array
                items:
                  $ref: '#/definitions/Subscriber'
              pagination:
                $ref: '#/definitions/Pagination'
        '404':
          description: Newsletter not found
        '500':
          description: Server error
    post:
      summary: Add subscribers
      description: Add one or more subscribers to a newsletter
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AddSubscribersRequest'
      responses:
        '201':
          description: Subscribers added successfully
        '400':
          description: Invalid subscribers payload
        '404':
          description: Newsletter not found
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/subscribers/{email}:
    delete:
      summary: Remove a subscriber
      description: Hard delete a subscriber from a newsletter
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
        - name: email
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Subscriber removed successfully
        '404':
          description: Subscriber not found
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/offline:
    put:
      summary: Take a newsletter offline
      description: Mark a newsletter as offline and unsubscribable
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Newsletter taken offline successfully
        '500':
          description: Server error

  /api/newsletter/{newsletterId}/online:
    put:
      summary: Bring a newsletter online
      description: Mark a newsletter as online and subscribable
      security:
        - AdminBearerAuth: []
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Newsletter brought online successfully
        '500':
          description: Server error

  /api/subscribe/confirm/{token}:
    get:
      summary: Confirm subscription
      description: Confirm a subscription using the provided token
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '302':
          description: Redirect to the subscription success page
        '400':
          description: Invalid or expired token
        '500':
          description: Server error

  /api/subscribe/cancel/{token}:
    get:
      summary: Cancel subscription
      description: Cancel a subscription using the provided token
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Unsubscribed successfully
        '400':
          description: Invalid or expired token
        '500':
          description: Server error

  /api/subscribe/list-unsubscribe/{token}:
    post:
      summary: One-click unsubscribe
      description: RFC 8058 one-click unsubscribe endpoint used by mailbox providers.
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Unsubscribed successfully
        '400':
          description: Invalid unsubscribe token
        '503':
          description: Unsubscribe signing is not configured
        '500':
          description: Server error

  /api/subscribe/unsubscribe/{token}:
    get:
      summary: Visible unsubscribe confirmation
      description: Human-facing unsubscribe link included in newsletter footers. Renders a confirmation page without changing subscriber state.
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Confirmation page rendered
        '400':
          description: Invalid unsubscribe token
        '503':
          description: Unsubscribe signing is not configured
        '500':
          description: Server error
    post:
      summary: Visible unsubscribe
      description: Form-compatible unsubscribe endpoint that changes subscriber state after the user confirms.
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Unsubscribed successfully
        '400':
          description: Invalid unsubscribe token
        '503':
          description: Unsubscribe signing is not configured
        '500':
          description: Server error

  /api/ses/sns/{token}:
    post:
      summary: SES SNS webhook
      description: Receives signed SES bounce, complaint, and subscription confirmation notifications from SNS.
      parameters:
        - name: token
          in: path
          required: true
          type: string
      responses:
        '200':
          description: SES notification processed
        '400':
          description: Invalid SNS payload
        '401':
          description: Invalid webhook token
        '403':
          description: Unexpected SNS topic
        '503':
          description: SES webhook token is not configured
        '500':
          description: Server error

  /api/subscribe/send-confirmation:
    post:
      summary: Send confirmation email
      description: Send a confirmation email with a temporary token
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SendConfirmationRequest'
      responses:
        '200':
          description: Confirmation email sent successfully
        '400':
          description: Validation error
        '403':
          description: Bot verification failed
        '404':
          description: Newsletter not found
        '409':
          description: Newsletter is not subscribable
        '429':
          description: Too many requests
          headers:
            Retry-After:
              type: string
              description: Seconds clients should wait before retrying.
        '500':
          description: Server error

  /api/subscribe/send-cancellation:
    post:
      summary: Send cancellation email
      description: Send a cancellation email with a temporary token
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SendCancellationRequest'
      responses:
        '200':
          description: Cancellation email sent successfully
        '400':
          description: Validation error
        '403':
          description: Bot verification failed
        '404':
          description: Newsletter not found
        '429':
          description: Too many requests
          headers:
            Retry-After:
              type: string
              description: Seconds clients should wait before retrying.
        '500':
          description: Server error

  /newsletter/{newsletterId}:
    get:
      summary: Get newsletter details
      description: View newsletter details
      parameters:
        - name: newsletterId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Newsletter details retrieved successfully
          schema:
            $ref: '#/definitions/Newsletter'
        '404':
          description: Newsletter not found
        '500':
          description: Server error

definitions:
  CreateNewsletterRequest:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      logo:
        type: string

  SendConfirmationRequest:
    type: object
    required:
      - email
      - newsletterId
      - turnstileToken
    properties:
      email:
        type: string
        format: email
      newsletterId:
        type: string
        format: uuid
      turnstileToken:
        type: string
      firstName:
        type: string
      lastName:
        type: string

  SendCancellationRequest:
    type: object
    required:
      - email
      - newsletterId
      - turnstileToken
    properties:
      email:
        type: string
        format: email
      newsletterId:
        type: string
        format: uuid
      turnstileToken:
        type: string

  UpdateNewsletterRequest:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      logo:
        type: string

  AddSubscribersRequest:
    type: object
    required:
      - subscribers
    properties:
      subscribers:
        type: array
        items:
          $ref: '#/definitions/SubscriberInput'

  SubscriberInput:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email
      firstName:
        type: string
      lastName:
        type: string

  Newsletter:
    type: object
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
      description:
        type: string
      logo:
        type: string
      subscriberCount:
        type: integer
      subscribable:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  PublishConfig:
    type: object
    properties:
      emailAddress:
        type: string
        format: email

  GoogleWorkspacePublishRequest:
    type: object
    required:
      - from
      - subject
      - html
      - text
    properties:
      from:
        type: string
        description: Gmail sender header value, for example "Name <sender@example.com>".
      subject:
        type: string
        description: Subject containing the [Newsletter-ID:<uuid>] tag.
      html:
        type: string
        description: HTML body returned by GmailApp.getBody().
      text:
        type: string
        description: Plain text body returned by GmailApp.getPlainBody().
      messageId:
        type: string
        description: Gmail message ID used for duplicate suppression.
      sourceMessageId:
        type: string
        description: Alternate source message ID used for duplicate suppression.
      receivedAt:
        type: string
        format: date-time
        description: Gmail received timestamp. Accepted for observability; not required for publishing.

  DirectPublishNewsletterRequest:
    type: object
    required:
      - subject
      - html
      - text
    properties:
      subject:
        type: string
        description: Newsletter subject without the [Newsletter-ID:<uuid>] tag.
      html:
        type: string
        description: HTML body to send to subscribers.
      text:
        type: string
        description: Plain text body used for validation and future plain-text delivery support.
      sourceMessageId:
        type: string
        description: Optional idempotency key used for duplicate suppression.

  PublishNewsletterResponse:
    type: object
    properties:
      newsletterId:
        type: string
        format: uuid
      subject:
        type: string
      fileName:
        type: string
      textFileName:
        type: string
      sendId:
        type: string
        format: uuid
      send:
        $ref: '#/definitions/NewsletterSendSummary'
      queuedCount:
        type: integer
      queueFailedCount:
        type: integer
      duplicate:
        type: boolean

  NewsletterSendSummary:
    type: object
    properties:
      id:
        type: string
        format: uuid
      newsletterId:
        type: string
        format: uuid
      subject:
        type: string
      sourceMessageId:
        type: string
      status:
        type: string
        enum:
          - queued
          - sending
          - completed
          - completedWithFailures
      recipientCount:
        type: integer
      queuedCount:
        type: integer
      queueFailedCount:
        type: integer
      providerAcceptedCount:
        type: integer
      deliveredCount:
        type: integer
      deliveryDelayedCount:
        type: integer
      bouncedCount:
        type: integer
      complainedCount:
        type: integer
      failedCount:
        type: integer
      deadLetteredCount:
        type: integer
      lastError:
        type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      completedAt:
        type: string
        format: date-time

  NewsletterSendRecipient:
    type: object
    properties:
      id:
        type: string
        format: uuid
      sendId:
        type: string
        format: uuid
      newsletterId:
        type: string
        format: uuid
      email:
        type: string
        format: email
      recipientHash:
        type: string
      status:
        type: string
        enum:
          - queued
          - sending
          - providerAccepted
          - deliveryDelayed
          - delivered
          - bounced
          - complained
          - retrying
          - failed
          - deadLettered
      attempts:
        type: integer
      providerMessageId:
        type: string
      lastError:
        type: string
      queuedAt:
        type: string
        format: date-time
      sendingAt:
        type: string
        format: date-time
      providerAcceptedAt:
        type: string
        format: date-time
      deliveryDelayedAt:
        type: string
        format: date-time
      deliveredAt:
        type: string
        format: date-time
      bouncedAt:
        type: string
        format: date-time
      complainedAt:
        type: string
        format: date-time
      failedAt:
        type: string
        format: date-time
      deadLetteredAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  NewsletterSendEvent:
    type: object
    properties:
      id:
        type: integer
      sendId:
        type: string
        format: uuid
      newsletterId:
        type: string
        format: uuid
      recipientId:
        type: string
        format: uuid
      recipientHash:
        type: string
      email:
        type: string
        format: email
      eventType:
        type: string
      recipientStatus:
        type: string
      sendStatus:
        type: string
      message:
        type: string
      providerMessageId:
        type: string
      createdAt:
        type: string
        format: date-time

  NewsletterSendSnapshot:
    type: object
    properties:
      send:
        $ref: '#/definitions/NewsletterSendSummary'
      recipients:
        type: array
        items:
          $ref: '#/definitions/NewsletterSendRecipient'
      events:
        type: array
        items:
          $ref: '#/definitions/NewsletterSendEvent'
      lastEventId:
        type: integer

  NewsletterSendStreamMessage:
    type: object
    description: WebSocket messages are either connected acknowledgements or sendEvent updates. sendEvent updates include the event and may include the latest aggregate send and recipient row.
    properties:
      type:
        type: string
        enum:
          - connected
          - sendEvent
      sendId:
        type: string
        format: uuid
      event:
        $ref: '#/definitions/NewsletterSendEvent'
      send:
        $ref: '#/definitions/NewsletterSendSummary'
      recipient:
        $ref: '#/definitions/NewsletterSendRecipient'

  Subscriber:
    type: object
    properties:
      email:
        type: string
        format: email
      first_name:
        type: string
      last_name:
        type: string
      newsletter_id:
        type: string
        format: uuid
      isSubscribed:
        type: boolean
      upsertedAt:
        type: string
        format: date-time

  Pagination:
    type: object
    properties:
      page:
        type: integer
      limit:
        type: integer
      total:
        type: integer

securityDefinitions:
  AdminBearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: Bearer token required by Worker-level admin auth middleware.
  PublishBridgeBearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: Bearer token required by the Google Workspace publish bridge.
