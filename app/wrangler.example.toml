name = "replace-with-worker-name"
main = "src/index.ts"
compatibility_date = "2026-02-23"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 300_000
subrequests = 10_000

[vars]
ALLOWED_EMAILS = "replace-with-allowed-emails"
PUBLISH_EMAIL_ADDRESS = "replace-with-publish-email-address"
PUBLIC_ORIGIN = "https://newsletter.example.com"
TURNSTILE_SITE_KEY = "replace-with-turnstile-site-key"
# Optional: set to the SES/SNS topic ARN to reject webhook posts from any other topic.
# SES_SNS_TOPIC_ARN = "arn:aws:sns:us-west-1:123456789012:letterdrop"

[[services]]
binding = "NOTIFICATION"
service = "replace-with-notification-service"

[[queues.producers]]
binding = "QUEUE"
queue = "replace-with-queue"

[[queues.consumers]]
queue = "replace-with-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 10
max_concurrency = 32
dead_letter_queue = "replace-with-dead-letter-queue"

[[queues.consumers]]
queue = "replace-with-dead-letter-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 0

[[durable_objects.bindings]]
name = "SEND_STATUS_BROKER"
class_name = "SendStatusBroker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SendStatusBroker"]

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "replace-with-r2-bucket"

[[d1_databases]]
binding = "DB"
database_name = "replace-with-d1-database"
database_id = "00000000-0000-0000-0000-000000000000"
